name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          # The floor of the constraints: laravel-admin 1.47, starter 1.4.3.
          - php: '8.3'
            dependencies: lowest
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, zip, gd
          coverage: none
      - name: Install
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
      - name: Installed admin packages
        run: composer show 'dskripchenko/*'
      - name: Prepare
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force --seed
          php artisan admin:publish
      - name: Code style
        if: matrix.dependencies == 'highest'
        run: vendor/bin/pint --test
      - name: Test
        run: php artisan test

  create-project:
    # What a user gets: `composer create-project` of this commit, including
    # post-create-project-cmd, then the running app over HTTP.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    name: create-project smoke (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, zip, gd
          coverage: none
      - name: composer create-project
        run: |
          repo='{"type":"path","url":"'"$GITHUB_WORKSPACE"'/src","options":{"symlink":false,"versions":{"dskripchenko/laravel-admin-skeleton":"99.0.0"}}}'
          composer create-project dskripchenko/laravel-admin-skeleton app 99.0.0 \
            --repository="$repo" --no-interaction --no-progress
      - name: Smoke test
        run: src/.github/scripts/smoke.sh app
